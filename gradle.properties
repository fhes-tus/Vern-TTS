# Android/Gradle defaults
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Use Android Studio's embedded JDK instead of the old Oracle Java 8 shim on PATH.
org.gradle.java.home=C\:/Program Files/Android/Android Studio/jbr

# Give Gradle 4 to 6 Gigabytes of RAM to handle R8 shrinking
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel builds to speed things up now that it has memory
org.gradle.parallel=true

# Prevent Gradle from trying to auto-download JDK/toolchains during sync.
# Use Android Studio's Embedded JDK instead.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=C\:/Program Files/Android/Android Studio/jbr
