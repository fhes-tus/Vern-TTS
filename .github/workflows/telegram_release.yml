name: Broadcast Release to Telegram

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published release tag to broadcast (e.g. v2.7.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  broadcast:
    name: Broadcast to @myreader_veritas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Broadcast Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '@myreader_veritas' }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/broadcast_release.py
